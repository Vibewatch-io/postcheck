name: Looks different on X
description: Your post looks different on X than it did in Postcheck
title: "Looks different on X: "
labels: [render-mismatch]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. Two screenshots are all we need: your post on X, and the same post in Postcheck. Drag or paste each one into its box below.
  - type: input
    id: url
    attributes:
      label: Link to the post on X
      description: On the post, tap Share, then Copy link.
      placeholder: https://x.com/yourname/status/123…
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it on X?
      options:
        - iPhone app
        - Android app
        - A web browser (x.com)
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: Screenshot from X
      description: Show the whole post, including "Show more" if X shows it.
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Screenshot from Postcheck
      description: Show the whole preview, plus any note above it.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Postcheck settings
      description: Filled in for you when you come from the "Tell us" link under the preview. Otherwise, the phone or web view and the theme you had picked.
  - type: textarea
    id: what
    attributes:
      label: What looks different?
      description: Optional. A sentence is plenty.
      placeholder: The lines break in different places, X cuts it off sooner, a link looks wrong…
  - type: input
    id: device
    attributes:
      label: Which phone or computer?
      description: Optional.
      placeholder: iPhone 15 Pro, Pixel 8, MacBook Air…
